<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocol X · Hollywood Transformation</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --void: #060608;
  --deep: #0e0e12;
  --surface: #16161c;
  --lift: #1e1e26;
  --border: #2a2a36;
  --gold: #e8c84a;
  --gold2: #f0a500;
  --red: #e03232;
  --ice: #7ec8e3;
  --green: #4ae882;
  --text: #eeebe4;
  --muted: #5a5a6a;
  --dim: #333340;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--void);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}
.app-header {
  background: var(--deep);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  gap: 10px;
  flex-wrap: wrap;
}
.logo { font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: 0.05em; color: var(--text); white-space: nowrap; }
.logo span { color: var(--gold); }
.week-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 0.2em; color: var(--gold);
  background: rgba(232,200,74,0.08); border: 1px solid rgba(232,200,74,0.2);
  padding: 4px 10px; text-transform: uppercase; white-space: nowrap;
}
.hbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.hbtn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 0.15em; font-weight: 700; text-transform: uppercase;
  padding: 7px 12px; border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.hbtn:hover { border-color: var(--gold); color: var(--gold); }
.hbtn.gold { background: var(--gold); color: var(--void); border-color: var(--gold); }
.hbtn.gold:hover { background: var(--gold2); border-color: var(--gold2); }
.hbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.phase-bar {
  background: var(--deep); border-bottom: 1px solid var(--border);
  padding: 8px 20px; display: flex; gap: 5px; overflow-x: auto;
  scrollbar-width: none; align-items: center;
}
.phase-bar::-webkit-scrollbar { display: none; }
.phase-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; white-space: nowrap; margin-right: 4px; }
.pbtn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.15em;
  font-weight: 700; text-transform: uppercase; padding: 5px 12px;
  border: 1px solid var(--border); background: none; color: var(--muted);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.pbtn.active { background: var(--gold); color: var(--void); border-color: var(--gold); }
.prog-bar {
  background: var(--deep); border-bottom: 1px solid var(--border);
  padding: 8px 20px; display: flex; align-items: center; gap: 12px;
}
.prog-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.prog-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.prog-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }
.prog-pct { font-family: 'Anton', sans-serif; font-size: 15px; color: var(--gold); white-space: nowrap; }
.day-nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; scrollbar-width: none; }
.day-nav::-webkit-scrollbar { display: none; }
.dtab { flex: 1; min-width: 72px; padding: 10px 6px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.dtab:hover { background: var(--lift); }
.dtab.active { border-bottom-color: var(--gold); }
.dtab .dn { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.15em; font-weight: 700; text-transform: uppercase; color: var(--muted); display: block; }
.dtab.active .dn { color: var(--gold); }
.dtab .dt { font-size: 9px; color: var(--dim); display: block; margin-top: 2px; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; }
.dtab.active .dt { color: var(--muted); }
.panels { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { border-right: 1px solid var(--border); }
.panel:last-child { border-right: none; }
.panel-hd { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--deep); position: sticky; top: 52px; z-index: 10; }
.panel-ttl { font-family: 'Anton', sans-serif; font-size: 15px; letter-spacing: 0.08em; }
.panel-meta { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.panel-body { padding: 14px 18px; }
.mc { border: 1px solid var(--border); background: var(--surface); margin-bottom: 8px; position: relative; overflow: hidden; }
.mc::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--gold); }
.mc-top { padding: 9px 12px 9px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mc-time { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 2px; }
.mc-name { font-size: 13px; font-weight: 500; }
.mc-kcal { font-family: 'Anton', sans-serif; font-size: 17px; color: var(--gold); white-space: nowrap; line-height: 1; }
.mc-kcal small { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); display: block; text-align: right; }
.mc-bot { padding: 0 12px 10px 16px; }
.mc-desc { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 7px; }
.macros { display: flex; gap: 5px; flex-wrap: wrap; }
.mac { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.08em; padding: 2px 7px; border: 1px solid; }
.mp { border-color: rgba(232,200,74,0.3); color: var(--gold); }
.mc2 { border-color: rgba(240,165,0,0.3); color: var(--gold2); }
.mf { border-color: rgba(126,200,227,0.3); color: var(--ice); }
.day-tots { background: var(--deep); border: 1px solid rgba(232,200,74,0.12); padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
.tot { text-align: center; }
.tv { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--gold); display: block; line-height: 1; }
.tl { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.ex-sec { margin-bottom: 12px; }
.ex-sec-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
.ex-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; background: var(--deep); border-left: 2px solid transparent; margin-bottom: 2px; transition: border-left-color 0.15s; }
.ex-row:hover { border-left-color: var(--gold); }
.ex-nm { font-size: 12px; color: var(--text); }
.ex-sub2 { font-size: 10px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.07em; text-transform: uppercase; }
.ex-dt { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; color: var(--gold2); text-align: right; white-space: nowrap; }
.ex-rst { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; color: var(--muted); text-align: right; }
.wo-sum { background: rgba(232,200,74,0.04); border: 1px solid rgba(232,200,74,0.1); padding: 9px 12px; display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
.wsi span:first-child { font-family: 'Anton', sans-serif; font-size: 18px; color: var(--gold); display: block; line-height: 1; }
.wsi span:last-child { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.rest-card { text-align: center; padding: 40px 16px; }
.rest-word { font-family: 'Anton', sans-serif; font-size: 60px; color: var(--dim); letter-spacing: 0.05em; }
.rest-items { margin-top: 16px; display: flex; flex-direction: column; gap: 5px; max-width: 220px; margin-left: auto; margin-right: auto; }
.rest-item { padding: 7px 12px; background: var(--deep); border: 1px solid var(--border); font-size: 11px; color: var(--muted); text-align: left; }
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 260px; gap: 14px; }
.spin { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.spin-txt { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
.overlay { position: fixed; inset: 0; background: rgba(6,6,8,0.94); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border); max-width: 540px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-hd { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-ttl { font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.05em; }
.modal-x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; }
.modal-x:hover { color: var(--text); }
.modal-bd { padding: 18px; }
.gcat { margin-bottom: 14px; }
.gcat-ttl { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 7px; font-weight: 700; }
.gitem { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px solid rgba(42,42,54,0.4); font-size: 12px; }
.gitem:last-child { border-bottom: none; }
.gcheck { width: 15px; height: 15px; border: 1px solid var(--border); border-radius: 2px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.gcheck.on { background: var(--gold); border-color: var(--gold); }
.gcheck.on::after { content: '✓'; font-size: 9px; color: var(--void); font-weight: 700; }
.gqty { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: var(--gold2); min-width: 56px; font-weight: 700; }
.gitem.done { text-decoration: line-through; opacity: 0.35; }
.fl { margin-bottom: 14px; }
.fl label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
.fi { width: 100%; background: var(--deep); border: 1px solid var(--border); color: var(--text); padding: 10px 13px; font-family: 'Barlow', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
.fi:focus { border-color: var(--gold); }
.fi::placeholder { color: var(--muted); }
textarea.fi { min-height: 160px; resize: vertical; font-size: 11px; line-height: 1.6; }
.note { padding: 10px 14px; font-size: 11px; line-height: 1.6; border-left: 3px solid; margin-bottom: 12px; }
.ng { border-color: var(--gold); background: rgba(232,200,74,0.04); color: #a09050; }
.ng strong { color: var(--gold); }
.nr { border-color: var(--red); background: rgba(224,50,50,0.04); color: #a07070; }
.nr strong { color: var(--red); }
.ngreen { border-color: var(--green); background: rgba(74,232,130,0.04); color: #60a070; }
.ngreen strong { color: var(--green); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 10px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.1em; color: var(--text); z-index: 1000; transform: translateY(60px); opacity: 0; transition: all 0.25s; max-width: 280px; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.err { border-left-color: var(--red); }
.toast.ok { border-left-color: var(--green); }
.err-box { background: rgba(224,50,50,0.06); border: 1px solid rgba(224,50,50,0.2); padding: 14px 16px; margin: 16px 0; font-size: 12px; color: #c08080; line-height: 1.6; }
.err-box strong { color: var(--red); display: block; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">PROTOCOL <span>X</span></div>
  <div class="week-chip" id="weekChip">Week 1 · Phase 1</div>
  <div class="hbtns">
    <button class="hbtn" onclick="openGrocery()">🛒 Grocery</button>
    <button class="hbtn" onclick="openEmail()">📧 Email Today</button>
    <button class="hbtn gold" id="genBtn" onclick="generateWeek()">⚡ New Week</button>
  </div>
</div>

<div class="phase-bar">
  <span class="phase-lbl">Phase:</span>
  <button class="pbtn active" onclick="jumpPhase(1,this)">1 · Adapt</button>
  <button class="pbtn" onclick="jumpPhase(2,this)">2 · Accelerate</button>
  <button class="pbtn" onclick="jumpPhase(3,this)">3 · Deep Cut</button>
  <button class="pbtn" onclick="jumpPhase(4,this)">4 · Camera Ready</button>
</div>

<div class="prog-bar">
  <span class="prog-lbl">6-Month Progress</span>
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:4%"></div></div>
  <span class="prog-pct" id="progPct">4%</span>
  <span class="prog-lbl" id="progWks" style="margin-left:4px">Week 1 of 28</span>
</div>

<div class="day-nav" id="dayNav"></div>

<div class="panels">
  <div class="panel">
    <div class="panel-hd">
      <span class="panel-ttl">MEALS</span>
      <span class="panel-meta" id="mealMeta">—</span>
    </div>
    <div class="panel-body" id="mealPanel">
      <div class="loading"><div class="spin"></div><div class="spin-txt">Initializing...</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-hd">
      <span class="panel-ttl">TRAINING</span>
      <span class="panel-meta" id="woMeta">—</span>
    </div>
    <div class="panel-body" id="woPanel">
      <div class="loading"><div class="spin"></div><div class="spin-txt">Initializing...</div></div>
    </div>
  </div>
</div>

<div class="overlay" id="gModal">
  <div class="modal">
    <div class="modal-hd"><span class="modal-ttl">GROCERY LIST</span><button class="modal-x" onclick="closeAll()">✕</button></div>
    <div class="modal-bd" id="gBody"></div>
  </div>
</div>

<div class="overlay" id="eModal">
  <div class="modal">
    <div class="modal-hd"><span class="modal-ttl">TODAY'S SCHEDULE</span><button class="modal-x" onclick="closeAll()">✕</button></div>
    <div class="modal-bd">
      <div class="note ng"><strong>Daily email:</strong> Your schedule is auto-generated below. Copy it and paste into your email app, or click Open Mail.</div>
      <div class="fl">
        <label>Your Email</label>
        <input class="fi" type="email" id="emailTo" placeholder="you@example.com">
      </div>
      <div class="fl">
        <label>Today's Schedule</label>
        <textarea class="fi" id="emailBody" readonly placeholder="Loading..."></textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="hbtn" onclick="copyEmail()" style="flex:1">📋 Copy</button>
        <button class="hbtn gold" onclick="openMail()" style="flex:1">✉️ Open Mail</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_SHORTS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAY_TYPES = ['Push','HIIT','Pull','HIIT+Z2','Legs','Full Body','Rest'];
const PHASE_CFG = {
  1: { label:'Adapt',  startWk:1,  cal:'1,600–1,750', protein:'180g', carbs:'Moderate',          hiit:'Zone 2 only',   note:'Semaglutide adaptation. Train at 70%. No HIIT.' },
  2: { label:'Accel',  startWk:4,  cal:'1,400–1,550', protein:'180g', carbs:'Cycling',            hiit:'2x/week',       note:'Full throttle. 6 training days. Aggressive deficit.' },
  3: { label:'Cut',    startWk:9,  cal:'1,350–1,500', protein:'185g', carbs:'Aggressive cycling', hiit:'2-3x/week',     note:'Deep cut. Visceral fat elimination. Peak volume.' },
  4: { label:'Final',  startWk:19, cal:'1,300–1,500', protein:'190g', carbs:'Very low rest days', hiit:'3x/week',       note:'Camera-ready. Glycogen loading in final 2 weeks.' }
};
const PROFILE = `Male 38yo, 194.6lbs, BF 27.8%, LDL 159 HIGH. Wegovy semaglutide. Goal: ~159lbs 12% BF.
NEVER: bananas, cucumbers, cottage cheese, soups.
REQUIRED: salmon 3x/wk, sardines 1x/wk, oat bran 3x/wk.
Protein: chicken, turkey, fish, egg whites, whey isolate, Greek yogurt, shrimp. Red meat max 2x/wk.
Saturday=refeed ~1900cal. Sunday=rest ~1200cal.`;

let S = {
  currentWeek: 1, currentPhase: 1, currentDay: 0,
  plan: null, grocery: null, checks: {}, emailCache: {},
  userEmail: ''
};

function init() {
  try {
    const saved = localStorage.getItem('protocolX');
    if (saved) {
      const d = JSON.parse(saved);
      S.currentWeek = d.week || 1;
      S.currentPhase = d.phase || 1;
      S.plan = d.plan || null;
      S.grocery = d.grocery || null;
      S.checks = d.checks || {};
      S.userEmail = d.email || '';
    }
  } catch(e) {}

  if (S.userEmail) document.getElementById('emailTo').value = S.userEmail;

  buildDayNav();
  updateProgress();

  if (S.plan) {
    renderDay(S.currentDay);
    setTimeout(() => buildEmailBody(S.currentDay), 1500);
  } else {
    generateWeek();
  }
}

function saveState() {
  try {
    localStorage.setItem('protocolX', JSON.stringify({
      week: S.currentWeek, phase: S.currentPhase,
      plan: S.plan, grocery: S.grocery,
      checks: S.checks, email: S.userEmail
    }));
  } catch(e) {}
}

function buildDayNav() {
  document.getElementById('dayNav').innerHTML = DAYS.map((d,i) => `
    <div class="dtab ${i===0?'active':''}" onclick="selectDay(${i})">
      <span class="dn">${DAY_SHORTS[i]}</span>
      <span class="dt">${DAY_TYPES[i]}</span>
    </div>`).join('');
}

function selectDay(i) {
  S.currentDay = i;
  document.querySelectorAll('.dtab').forEach((t,j) => t.classList.toggle('active', j===i));
  renderDay(i);
  delete S.emailCache[i];
}

async function generateWeek() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ Generating...';
  setLoading('mealPanel','Generating meal plan...');
  setLoading('woPanel','Generating workouts...');

  const p = S.currentPhase, w = S.currentWeek, cfg = PHASE_CFG[p];

  const prompt = `You are a Hollywood transformation coach. Generate a complete fresh 7-day meal and workout plan for Week ${w}, Phase ${p} (${cfg.label}).

${PROFILE}

PHASE ${p}: Calories ${cfg.cal}/day | Protein ${cfg.protein}/day | Carbs: ${cfg.carbs} | HIIT: ${cfg.hiit}
FOCUS: ${cfg.note}
VARIETY: Week ${w} meals must be noticeably different from a standard template. Vary cuisines and cooking methods.
WEIGHTS: Provide specific weight ranges per exercise for a moderately fit 38yo male at 194lbs training for ${w} weeks.

RULES:
- NEVER include: bananas, cucumbers, cottage cheese, soups
- Salmon minimum 3 meals this week
- Sardines at least 1 meal
- Oat bran at least 3 breakfasts
- Saturday: refeed ~1900-2000 cal, high carbs
- Sunday: rest day, ~1200-1300 cal
- Phase ${p===1?'1: No HIIT. Resistance Mon/Wed/Fri. Zone 2 Tue/Thu. Light full body Sat.':p===2?'2: HIIT Tue and Thu. 6 training days.':p===3?'3: HIIT Tue/Thu/Sat. Peak volume.':'4: HIIT 3x/week. Final cut intensity.'}

Respond ONLY with raw valid JSON, no markdown:
{"week":${w},"phase":${p},"theme":"6-word week theme","days":[{"day":"Monday","type":"Push Day","meals":[{"time":"07:30","label":"Breakfast","name":"Meal name","desc":"Ingredients and brief prep","protein":40,"carbs":38,"fat":6,"calories":365}],"totalProtein":185,"totalCarbs":140,"totalFat":35,"totalCalories":1620,"workout":{"type":"Push — Chest / Shoulders / Triceps","duration":"65 min","calories":350,"sections":[{"label":"Main Compounds","exercises":[{"name":"Barbell Bench Press","sets":"4x6","weight":"125-135 lbs","rest":"120s","note":"2s eccentric"}]}]}}]}`;

  try {
    const data = await callClaude(prompt, 8000);
    const raw = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const cleaned = raw.replace(/```json|```/g,'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').trim();
    const jStart = cleaned.indexOf('{');
    const jEnd = cleaned.lastIndexOf('}');
    if (jStart === -1 || jEnd === -1) throw new Error('No JSON in response — try again.');
    S.plan = JSON.parse(cleaned.slice(jStart, jEnd + 1));
    S.grocery = null; S.emailCache = {};
    saveState();
    updateProgress();
    renderDay(S.currentDay);
    toast(`Week ${w} plan ready`, 'ok');
    setTimeout(() => buildEmailBody(S.currentDay), 1500);
  } catch(err) {
    showErr('mealPanel', err.message);
    showErr('woPanel', '');
    toast('Generation failed', 'err');
  }

  btn.disabled = false; btn.textContent = '⚡ New Week';
}

async function buildEmailBody(dayIdx) {
  if (!S.plan || S.emailCache[dayIdx]) return S.emailCache[dayIdx] || '';
  const day = S.plan.days[dayIdx];
  if (!day) return '';

  const prompt = `Write a concise motivational daily schedule email for a Hollywood transformation client.
DAY: ${day.day}, Week ${S.currentWeek}, Phase ${S.currentPhase}
PROFILE: Male 38yo, on Wegovy oral semaglutide — reminder to take on waking, 30 min before eating.
MEALS: ${(day.meals||[]).map(m=>`${m.time} ${m.label}: ${m.name} (P:${m.protein}g C:${m.carbs}g F:${m.fat}g ${m.calories}cal)`).join(' | ')}
WORKOUT: ${day.workout?.type||'Rest'} ${day.workout?.sections?day.workout.sections.map(s=>s.label+': '+s.exercises.map(e=>e.name+' '+e.sets+' @'+e.weight).join(', ')).join(' | '):''}
TOTALS: ${day.totalCalories}cal | ${day.totalProtein}g protein
Write plain text. First line: "SUBJECT: [subject]". Include Wegovy reminder, all meals with macros, full workout, daily targets. Keep it tight.`;

  try {
    const data = await callClaude(prompt, 1200);
    const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    S.emailCache[dayIdx] = text;
    return text;
  } catch(e) { return ''; }
}

function renderDay(idx) {
  if (!S.plan) return;
  const day = S.plan.days[idx];
  if (!day) return;
  document.getElementById('mealMeta').textContent = `${day.totalCalories||'—'}cal · ${day.totalProtein||'—'}g prot`;
  document.getElementById('woMeta').textContent = day.workout?.duration || '—';
  renderMeals(day);
  renderWorkout(day);
}

function renderMeals(day) {
  const p = document.getElementById('mealPanel');
  if (!day.meals?.length) {
    p.innerHTML = `<div class="rest-card"><div class="rest-word">REST</div><p style="color:var(--muted);font-size:12px;margin-top:10px">Recovery day — light meals, prioritize protein.</p></div>`;
    return;
  }
  p.innerHTML = day.meals.map(m=>`
    <div class="mc">
      <div class="mc-top">
        <div><span class="mc-time">${m.time} · ${m.label}</span><div class="mc-name">${m.name}</div></div>
        <div class="mc-kcal">${m.calories}<small>cal</small></div>
      </div>
      <div class="mc-bot">
        <div class="mc-desc">${m.desc}</div>
        <div class="macros"><span class="mac mp">P:${m.protein}g</span><span class="mac mc2">C:${m.carbs}g</span><span class="mac mf">F:${m.fat}g</span></div>
      </div>
    </div>`).join('') + `
  <div class="day-tots">
    <div class="tot"><span class="tv">${day.totalProtein}g</span><span class="tl">Protein</span></div>
    <div class="tot"><span class="tv">${day.totalCarbs}g</span><span class="tl">Carbs</span></div>
    <div class="tot"><span class="tv">${day.totalFat}g</span><span class="tl">Fat</span></div>
    <div class="tot"><span class="tv">${day.totalCalories}</span><span class="tl">Calories</span></div>
  </div>`;
}

function renderWorkout(day) {
  const p = document.getElementById('woPanel');
  const wo = day.workout;
  if (!wo || day.day==='Sunday' || wo.type?.toLowerCase().includes('rest')) {
    p.innerHTML = `<div class="rest-card"><div class="rest-word">REST</div><div class="rest-items"><div class="rest-item">✓ Take Wegovy pill on waking</div><div class="rest-item">✓ 30-min walk max</div><div class="rest-item">✓ Meal prep for Mon–Wed</div><div class="rest-item">✓ Weekly weigh-in</div><div class="rest-item">✓ 8+ hours sleep</div></div></div>`;
    return;
  }
  p.innerHTML = `
    <div style="font-family:'Anton',sans-serif;font-size:17px;letter-spacing:0.05em;margin-bottom:12px">${wo.type}</div>
    ${(wo.sections||[]).map(sec=>`
      <div class="ex-sec">
        <div class="ex-sec-lbl">${sec.label}</div>
        ${(sec.exercises||[]).map(ex=>`
          <div class="ex-row">
            <div><div class="ex-nm">${ex.name}</div><div class="ex-sub2">${ex.weight||''} ${ex.note?'· '+ex.note:''}</div></div>
            <div><div class="ex-dt">${ex.sets}</div><div class="ex-rst">${ex.rest||''}</div></div>
          </div>`).join('')}
      </div>`).join('')}
    <div class="wo-sum">
      <div class="wsi"><span>${wo.duration}</span><span>Duration</span></div>
      <div class="wsi"><span>~${wo.calories}</span><span>Cal Burned</span></div>
    </div>`;
}

async function openGrocery() {
  document.getElementById('gModal').classList.add('open');
  if (S.grocery) { renderGrocery(S.grocery); return; }
  if (!S.plan) { document.getElementById('gBody').innerHTML = `<div class="note ng"><strong>Generate a week plan first.</strong></div>`; return; }
  document.getElementById('gBody').innerHTML = `<div class="loading"><div class="spin"></div><div class="spin-txt">Building list...</div></div>`;
  const meals = S.plan.days.map(d=>`${d.day}: ${(d.meals||[]).map(m=>m.name).join(', ')}`).join('\n');
  const prompt = `Generate a consolidated weekly grocery list for one person from these meals:\n${meals}\nRules: Never include bananas, cucumbers, cottage cheese, soups. Consolidate duplicates. Realistic quantities.\nRespond ONLY with raw JSON: {"categories":[{"name":"Proteins","items":[{"name":"Chicken breast","qty":"2.5 lbs"}]}]}\nCategories: Proteins, Produce, Grains & Carbs, Dairy & Eggs, Pantry & Condiments, Supplements`;
  try {
    const data = await callClaude(prompt, 2000);
    const raw = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const gc = raw.replace(/```json|```/g,'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').trim();
    const gs = gc.indexOf('{'); const ge = gc.lastIndexOf('}');
    if (gs === -1 || ge === -1) throw new Error('No JSON in grocery response — try again.');
    S.grocery = JSON.parse(gc.slice(gs, ge + 1));
    saveState();
    renderGrocery(S.grocery);
  } catch(e) {
    document.getElementById('gBody').innerHTML = `<div class="note nr"><strong>Error:</strong> ${e.message}</div>`;
  }
}

function renderGrocery(list) {
  document.getElementById('gBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase">Week ${S.currentWeek} · ${list.categories?.reduce((a,c)=>a+c.items.length,0)||0} items</div>
      <div style="display:flex;gap:6px">
        <button class="hbtn" onclick="clearChecks()" style="font-size:9px;padding:3px 9px">Clear</button>
        <button class="hbtn" onclick="copyGrocery()" style="font-size:9px;padding:3px 9px">📋 Copy</button>
      </div>
    </div>
    ${(list.categories||[]).map(cat=>`
      <div class="gcat">
        <div class="gcat-ttl">${cat.name}</div>
        ${(cat.items||[]).map((item,i)=>{
          const key=`${cat.name}-${i}`;
          const on=S.checks[key]||false;
          return `<div class="gitem${on?' done':''}" id="gi-${key}"><div class="gcheck${on?' on':''}" onclick="toggleCheck('${key}')"></div><span class="gqty">${item.qty}</span><span>${item.name}</span></div>`;
        }).join('')}
      </div>`).join('')}
    <button class="hbtn gold" onclick="copyGrocery()" style="width:100%;margin-top:8px">📋 Copy Full List</button>`;
}

function toggleCheck(key) {
  S.checks[key] = !S.checks[key];
  const el = document.getElementById(`gi-${key}`);
  const ch = el?.querySelector('.gcheck');
  if (el) el.classList.toggle('done', S.checks[key]);
  if (ch) ch.classList.toggle('on', S.checks[key]);
  saveState();
}
function clearChecks() { S.checks={}; saveState(); renderGrocery(S.grocery); }
function copyGrocery() {
  if (!S.grocery) return;
  let t = `WEEK ${S.currentWeek} GROCERY LIST\n\n`;
  S.grocery.categories.forEach(c => { t+=`${c.name.toUpperCase()}\n`; c.items.forEach(i=>t+=`  □ ${i.qty.padEnd(10)} ${i.name}\n`); t+='\n'; });
  navigator.clipboard.writeText(t).then(()=>toast('Copied!','ok'));
}

async function openEmail() {
  document.getElementById('eModal').classList.add('open');
  const emailEl = document.getElementById('emailTo');
  if (S.userEmail) emailEl.value = S.userEmail;
  emailEl.addEventListener('change', () => { S.userEmail = emailEl.value; saveState(); });
  const cached = S.emailCache[S.currentDay];
  if (cached) { document.getElementById('emailBody').value = cached; return; }
  document.getElementById('emailBody').value = 'Generating your schedule...';
  const body = await buildEmailBody(S.currentDay);
  document.getElementById('emailBody').value = body || 'Could not generate. Try clicking New Week first.';
}

function copyEmail() {
  const body = document.getElementById('emailBody').value;
  if (!body || body.includes('Generating')) { toast('Wait for generation','err'); return; }
  navigator.clipboard.writeText(body).then(()=>toast('Copied!','ok'));
}

function openMail() {
  const to = document.getElementById('emailTo').value.trim();
  const body = document.getElementById('emailBody').value;
  if (!to) { toast('Enter your email first','err'); return; }
  const lines = body.split('\n');
  let subject = `Protocol X · ${DAYS[S.currentDay]} · Week ${S.currentWeek}`;
  let emailBody = body;
  if (lines[0].startsWith('SUBJECT:')) { subject = lines[0].replace('SUBJECT:','').trim(); emailBody = lines.slice(1).join('\n').trim(); }
  navigator.clipboard.writeText(emailBody).then(()=>{
    toast('Copied — opening mail','ok');
    setTimeout(()=>{ window.location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody.substring(0,1500))}`; }, 400);
  });
}

function jumpPhase(p, btn) {
  S.currentPhase=p; S.currentWeek=PHASE_CFG[p].startWk;
  S.plan=null; S.grocery=null; S.emailCache={};
  saveState();
  document.querySelectorAll('.pbtn').forEach((b,i)=>b.classList.toggle('active',i===p-1));
  updateProgress(); generateWeek();
}

function updateProgress() {
  const w=S.currentWeek, pct=Math.round((w/28)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progWks').textContent=`Week ${w} of 28`;
  document.getElementById('weekChip').textContent=`Week ${w} · Phase ${S.currentPhase}`;
}

async function callClaude(prompt, maxTokens=4000) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, maxTokens })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
  return data;
}

function setLoading(id, msg='Generating...') {
  document.getElementById(id).innerHTML=`<div class="loading"><div class="spin"></div><div class="spin-txt">${msg}</div></div>`;
}
function showErr(id, msg) {
  if (!msg) { document.getElementById(id).innerHTML=''; return; }
  document.getElementById(id).innerHTML=`<div class="err-box"><strong>Error:</strong> ${msg}</div>`;
}
function closeAll() { document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }
function toast(msg, type='') {
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className=`toast ${type}`; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}
document.querySelectorAll('.overlay').forEach(el=>{ el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}); });

init();
</script>
</body>
</html>
